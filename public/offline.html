<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <title>Zinvest — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0a0f1c;
        color: #e2e8f0;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        border-radius: 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #94a3b8;
      }
      a {
        display: inline-flex;
        margin-top: 1.25rem;
        padding: 0.65rem 1.25rem;
        border-radius: 9999px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.875rem;
      }
      a:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>Check your connection, then try again. Cached lessons may load when you’re back online.</p>
      <a href="/">Retry</a>
    </div>
  </body>
</html>
